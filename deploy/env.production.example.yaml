# Example production settings. Copy this file to the ignored deploy/env.production.yaml and
# replace YOUR_DOMAIN. Keep secrets in your cloud secret manager, never in this file.

APP_ENV: "production"
APP_ANSWERER: "llm"
APP_USAGE_STORE: "firestore"
APP_OWNER_NAME: "Your Name"
APP_CORS_ORIGINS: '["https://YOUR_DOMAIN"]'
APP_MONTHLY_BUDGET_USD: "1.5"
APP_DAILY_BUDGET_USD: "0.3"
APP_RATE_LIMIT_PER_DAY: "25"
APP_TRUSTED_PROXY_HOPS: "0"
APP_LOG_LEVEL: "INFO"
